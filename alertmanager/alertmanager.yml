global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by:
    - alertname
    - instance
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: 8571160877
        send_resolved: true
        parse_mode: HTML
        message: |-
          {{ if eq .Status "firing" }}🚨 <b>ALERT FIRING</b>{{ else }}✅ <b>ALERT RESOLVED</b>{{ end }}
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
